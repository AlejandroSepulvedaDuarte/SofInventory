
services:
  db:
    image: postgres:15-alpine
    container_name: sofinventory_final_db
    environment:
      POSTGRES_DB: db_backend_sofinventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alejo123
    volumes:
      - sofinventory_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: sofinventory_final_backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db

  frontend:
    build: ./frontend
    container_name: sofinventory_final_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000


volumes:
  sofinventory_postgres_data: