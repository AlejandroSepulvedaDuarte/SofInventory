services:
  db:
    image: postgres:15-alpine
    container_name: sofinventory_db
    environment:
      POSTGRES_DB: db_sofinventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alejo123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: sofinventory_backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: sofinventory_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: