<!--
  Pantalla de categorías.
  Permite listar, crear y eliminar categorías que luego se usan para clasificar productos.
-->

<app-layout>
  <div class="page">

    <!-- Encabezado: título, contador y botón nueva categoría -->
    <div class="page-header">
      <div>
        <h1>Categorías</h1>
        <p>{{ categorias().length }} categorías registradas</p>
      </div>
      <button class="btn-primary" (click)="openModal()">+ Nueva Categoría</button>
    </div>

    <!-- Tabla principal de categorías -->
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Tipo de Control</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of categorias()">
            <td><strong>{{ c.nombre }}</strong></td>
            <!-- Badge según tipo_control (Inventario, Activo Fijo, Consumo) -->
            <td><span class="badge badge-activo">{{ c.tipo_control }}</span></td>
            <td>{{ c.descripcion || '—' }}</td>
            <td>
              <button class="btn-icon btn-danger" title="Eliminar" (click)="eliminar(c)">🗑️</button>
            </td>
          </tr>
          <!-- Fila vacía cuando no hay categorías -->
          <tr *ngIf="categorias().length === 0">
            <td colspan="4" class="empty-row">No hay categorías registradas</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Modal de creación de categoría -->
    <div class="modal-overlay" *ngIf="showModal()" (click)="closeModal()">
      <div class="modal modal-sm category-form-modal" role="dialog" aria-modal="true" aria-labelledby="category-form-title" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h2 id="category-form-title">Nueva Categoría</h2>
          <button class="close-btn" type="button" aria-label="Cerrar formulario" (click)="closeModal()"><i class="fas fa-xmark" aria-hidden="true"></i></button>
        </div>
        <div class="modal-error-region"><app-form-error-summary [message]="validation.summary()" /></div>

        <div class="modal-body">
          <p class="required-hint">Los campos marcados con <span class="required-marker">*</span> son obligatorios.</p>
          <div class="field">
            <label for="category-name">Nombre <span class="required-marker">*</span></label>
            <input id="category-name" type="text" required aria-required="true" maxlength="100" [(ngModel)]="form.nombre" (ngModelChange)="validation.clearField('nombre')" placeholder="Nombre de la categoría" [appFieldValidation]="validation.error('nombre')" validationMessageId="category-name-error" />
            <app-field-error id="category-name-error" [message]="validation.error('nombre')" />
          </div>

          <div class="field">
            <label for="category-control">Tipo de Control <span class="required-marker">*</span></label>
            <select id="category-control" required aria-required="true" [(ngModel)]="form.tipo_control" (ngModelChange)="validation.clearField('tipo_control')" [appFieldValidation]="validation.error('tipo_control')" validationMessageId="category-control-error">
              <option *ngFor="let t of tiposControl" [value]="t.value">{{ t.label }}</option>
            </select>
            <app-field-error id="category-control-error" [message]="validation.error('tipo_control')" />
          </div>

          <div class="field">
            <label>Descripción</label>
            <textarea [(ngModel)]="form.descripcion" rows="3" placeholder="Descripción opcional"></textarea>
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn-secondary" (click)="closeModal()">Cancelar</button>
          <button class="btn-primary" (click)="save()" [disabled]="saving()">
            {{ saving() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </div>
    </div>

  </div>
</app-layout>
