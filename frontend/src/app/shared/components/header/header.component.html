<header class="header">
  <!-- Bloque izquierdo: acceso móvil y contexto de navegación actual -->
  <div class="header-left">
    <button class="hamburger" (click)="toggleMobile()" title="Abrir menú">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Breadcrumb simple para ubicar al usuario dentro del módulo activo -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <span class="breadcrumb-item muted">ERP</span>
      <span class="breadcrumb-sep">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </span>
      <span class="breadcrumb-item current">{{ pageTitle() }}</span>
    </nav>
  </div>

  <!-- Bloque derecho: hora, acciones rápidas y resumen del usuario -->
  <div class="header-right">
    <div class="header-time">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>{{ currentTime() }}</span>
    </div>

    <!-- Botón reservado para futuras notificaciones -->
    <button class="icon-btn notif-btn" title="Notificaciones">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
    </button>

    <!-- Selector de tema de pantalla -->
    <div class="theme-switcher" [class.open]="themeMenuOpen()">
      <button
        class="icon-btn theme-btn"
        (click)="toggleThemeMenu()"
        title="Cambiar color de la pantalla"
        aria-haspopup="menu"
        [attr.aria-expanded]="themeMenuOpen()"
      >
        <i class="fa-solid" [ngClass]="themeIcon()"></i>
      </button>

      <div class="theme-menu" role="menu" *ngIf="themeMenuOpen()">
        <div class="theme-menu-title">
          <i class="fa-solid fa-palette"></i>
          <span>Color de pantalla</span>
        </div>
        <button
          *ngFor="let option of themeOptions"
          class="theme-option"
          [class.active]="currentTheme() === option.key"
          (click)="setTheme(option.key); $event.stopPropagation()"
          role="menuitemradio"
          [attr.aria-checked]="currentTheme() === option.key"
        >
          <i class="fa-solid" [ngClass]="option.icon"></i>
          <span>{{ option.label }}</span>
          <i class="fa-solid fa-check theme-option-check" *ngIf="currentTheme() === option.key"></i>
        </button>
      </div>
    </div>

    <div class="header-divider"></div>

    <!-- Cerrar sesión -->
    <button class="icon-btn logout-btn" (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión">
      <i class="fa-solid fa-xmark"></i>
      <span class="logout-label">Cerrar</span>
    </button>

    <!-- Chip del usuario autenticado con nombre y rol -->
    <div class="user-chip">
      <div class="chip-avatar">{{ userInitial() }}</div>
      <div class="chip-info">
        <span class="chip-name">{{ userName() }}</span>
        <span class="chip-role">{{ userRole() }}</span>
      </div>
    </div>
  </div>
</header>
