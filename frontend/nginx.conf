server {
    listen 80;

    # 1. Rutas del Frontend de Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy inverso para la API
    # ${BACKEND_URL} se reemplaza en tiempo de ejecución por envsubst
    # Valor por defecto para docker-compose: http://backend:8000
    # En Railway: se inyecta la URL del backend via variable de entorno
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Acceso al panel de administración
    location /admin/ {
        proxy_pass ${BACKEND_URL}/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}